          if-no-files-found: error
  linux:
    runs-on: ubuntu-latest
    container:
      image: crystallang/crystal:latest-alpine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          apk del openssl-dev openssl-libs-static
          apk add libressl-dev
      - name: Build the static binary
        run: |
          crystal projects.cr build:cli --production --release --static --no-debug --stats
          mkdir bin
          mv ./packages/cli/bin/zap ./bin/zap
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: zap_x86_64-linux-musl
          path: ./bin/zap
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
      - name: Debug openssl symbols (temporary)
        run: |
          echo "--- EVP_MD_size in our copied archive:"
          nm -g libs/libcrypto.a 2>/dev/null | grep -c "EVP_MD_size" || echo "0 (not found)"
          echo "--- EVP_MD_size in the image's openssl@1.1 dylib:"
          nm -g /opt/homebrew/Cellar/openssl@1.1/1.1.1w/lib/libcrypto.1.1.dylib 2>/dev/null | grep -c "EVP_MD_size" || echo "0 (not found)"
          nm -g /usr/local/Cellar/openssl@1.1/1.1.1w/lib/libcrypto.1.1.dylib 2>/dev/null | grep -c "EVP_MD_size" || echo "0 (not found)"
          echo "--- probe vs our archive:"
          cd /tmp && printf 'extern int EVP_MD_size(); int main(){return EVP_MD_size();}\n' > p.c
          clang -L"$GITHUB_WORKSPACE/libs" -Wl,-force_load,"$GITHUB_WORKSPACE/libs/libcrypto.a" p.c -o p1 2>&1 | tail -2; echo "archive probe exit=$?"
          echo "--- probe vs the 1.1 dylib:"
          clang -L/opt/homebrew/Cellar/openssl@1.1/1.1.1w/lib -L/usr/local/Cellar/openssl@1.1/1.1.1w/lib -lcrypto p.c -o p2 2>&1 | tail -2; echo "dylib probe exit=$?"
          echo "--- our archive's openssl version marker:"
          strings libs/libcrypto.a 2>/dev/null | grep -m2 -E "OpenSSL 3\.[0-9]" || true
      - name: Build the binary
        shell: bash
        run: |
          crystal projects.cr build:cli --progress --release --no-debug --stats
          mkdir bin
          mv ./packages/cli/bin/zap.exe ./bin/zap.exe
          ls -al ./bin
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: zap_x86_64-pc-win32.exe
          path: ${{ github.workspace }}\bin\zap.exe
          if-no-files-found: error
  trigger_release:
    runs-on: ubuntu-latest
    needs: [macos_x86_64, macos_arm64, linux, windows]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Check if release is needed
        run: |
          needs_release=$(git diff HEAD^1 shard.yml | grep "+version: " | wc -l | xargs)
          echo "needs_release=$needs_release" >> $GITHUB_ENV
      - name: Determine release version and tag
        uses: actions/github-script@v9
        id: release-data
        if: ${{ env.needs_release == 1 }}
        with:
          script: |
            const fs = require("fs")
            const shard = fs.readFileSync("shard.yml", "utf8")
            const match = shard.match(/^version:\s*(\S+)/m)
            if (!match) throw new Error("version missing from shard.yml")
            const version = match[1]
            const semverRegex = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/
            const [, major, minor, patch, prerelease, metadata] = version.match(semverRegex) || []
            if (!major) throw new Error(`invalid shard.yml version: ${version}`)
            const data = {
              version,
              major,
              minor,
              patch,
              prerelease,
              metadata,
              distTag: prerelease ? prerelease.split(".")[0] : "latest"
            }
            console.log(data)
            return data

      - name: Trigger release
        if: ${{ env.needs_release == 1 }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "release.yml" -f workflow_run_id=${{ github.run_id }} -f dist_tag="${{fromJSON(steps.release-data.outputs.result).distTag}}"
