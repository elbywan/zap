        run: |
          # PKG_CONFIG_PATH is set job-wide by the runner image and points
          # at an openssl@1.1 keg: pkg-config then emits -L flags for its
          # dylibs, which shadow the static archives copied into ./libs and
          # leave openssl symbols unresolved. Neutralize pkg-config so the
          # link falls back to plain -l flags resolved from ./libs first.
          # The openssl archives are passed by path: a bare -lcrypto
          # reaches the linker before the objects do (Crystal emits it in
          # its default flags), the archive pass pulls nothing, and the
          # later duplicate -lcrypto is ignored as such. Paths are
          # resolved after the objects, so the members are pulled.
          env CRYSTAL_LIBRARY_PATH=`pwd`/libs PKG_CONFIG_PATH= PKG_CONFIG_LIBDIR=/nonexistent \
            crystal projects.cr build:cli --no-debug --release \
            --link-flags "`pwd`/libs/libssl.a `pwd`/libs/libcrypto.a"
          mkdir bin
          mv ./packages/cli/bin/zap ./bin/zap
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: zap_arm64-apple-darwin
          path: ./bin/zap
          if-no-files-found: error
  linux:
    runs-on: ubuntu-latest
    container:
      image: crystallang/crystal:latest-alpine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          apk del openssl-dev openssl-libs-static
          apk add libressl-dev
      - name: Build the static binary
        run: |
          crystal projects.cr build:cli --production --release --static --no-debug --stats
          mkdir bin
          mv ./packages/cli/bin/zap ./bin/zap
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: zap_x86_64-linux-musl
          path: ./bin/zap
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
      - name: Build the binary
        shell: bash
        run: |
          crystal projects.cr build:cli --progress --release --no-debug --stats
          mkdir bin
          mv ./packages/cli/bin/zap.exe ./bin/zap.exe
          ls -al ./bin
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: zap_x86_64-pc-win32.exe
          path: ${{ github.workspace }}\bin\zap.exe
          if-no-files-found: error
  trigger_release:
    runs-on: ubuntu-latest
    needs: [macos_x86_64, macos_arm64, linux, windows]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Check if release is needed
        run: |
          needs_release=$(git diff HEAD^1 shard.yml | grep "+version: " | wc -l | xargs)
          echo "needs_release=$needs_release" >> $GITHUB_ENV
      - name: Determine release version and tag
        uses: actions/github-script@v9
        id: release-data
        if: ${{ env.needs_release == 1 }}
        with:
          script: |
            const fs = require("fs")
            const shard = fs.readFileSync("shard.yml", "utf8")
            const match = shard.match(/^version:\s*(\S+)/m)
            if (!match) throw new Error("version missing from shard.yml")
            const version = match[1]
            const semverRegex = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/
            const [, major, minor, patch, prerelease, metadata] = version.match(semverRegex) || []
            if (!major) throw new Error(`invalid shard.yml version: ${version}`)
            const data = {
              version,
              major,
              minor,
              patch,
              prerelease,
              metadata,
              distTag: prerelease ? prerelease.split(".")[0] : "latest"
            }
            console.log(data)
            return data

      - name: Trigger release
        if: ${{ env.needs_release == 1 }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "release.yml" -f workflow_run_id=${{ github.run_id }} -f dist_tag="${{fromJSON(steps.release-data.outputs.result).distTag}}"
