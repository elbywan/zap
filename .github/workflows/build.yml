name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macos_x86_64:
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Crystal
        # Not `brew install crystal`: the formula depends on llvm@22, which
        # has no Intel macOS bottle (Homebrew no longer builds them), so
        # Homebrew source-builds LLVM — 15+ minutes, then a formula patch
        # checksum failure. The action installs the official release tarball.
        uses: crystal-lang/install-crystal@v1
      - name: Install static library dependencies
        # These used to arrive with the crystal formula; all are bottled.
        run: brew install openssl@3 openssl@1.1 libyaml bdw-gc pcre2 libevent
      - name: Copy static libraries
        run: |
          mkdir -p ./libs
          # openssl@1.1, not @3: openssl@3 3.6 (the runner image ships
          # 3.6.4) no longer exports EVP_MD_size as a function, which
          # Crystal's stdlib references. The 1.1 archives provide it and
          # Crystal supports both ABIs.
          cp $(brew --prefix)/opt/openssl@1.1/lib/libssl.a ./libs
          cp $(brew --prefix)/opt/openssl@1.1/lib/libcrypto.a ./libs
          # libevent (optional: the default event loop is kqueue on macOS)
          cp $(brew --prefix)/opt/libevent/lib/libevent_pthreads.a ./libs || true
          cp $(brew --prefix)/opt/libevent/lib/libevent.a ./libs || true
          # libyaml
          cp $(brew --prefix)/opt/libyaml/lib/libyaml.a ./libs
          # libgc
          cp $(brew --prefix)/opt/bdw-gc/lib/libgc.a ./libs
          # libpcre
          cp $(brew --prefix)/opt/pcre2/lib/libpcre2-8.a ./libs
      - name: Build the binary
        # Statically link most non-system libraries
        run: |
          # pkg-config is neutralized so the link resolves every library
          # from the archives in ./libs: the runner image points
          # PKG_CONFIG_PATH at openssl@1.1's keg, whose pkg-config would
          # otherwise hand the linker -L flags for its dylibs.
          env CRYSTAL_LIBRARY_PATH=`pwd`/libs PKG_CONFIG_PATH= PKG_CONFIG_LIBDIR=/nonexistent crystal projects.cr build:cli --no-debug --release
          mkdir bin
          mv ./packages/cli/bin/zap ./bin/zap
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: zap_x86_64-apple-darwin
          path: ./bin/zap
          if-no-files-found: error
  macos_arm64:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Crystal
        # Not `brew install crystal`: the formula depends on llvm@22, which
        # has no Intel macOS bottle (Homebrew no longer builds them), so
        # Homebrew source-builds LLVM — 15+ minutes, then a formula patch
        # checksum failure. The action installs the official release tarball.
        uses: crystal-lang/install-crystal@v1
      - name: Install static library dependencies
        # These used to arrive with the crystal formula; all are bottled.
        run: brew install openssl@3 openssl@1.1 libyaml bdw-gc pcre2 libevent
      - name: Copy static libraries
        run: |
          mkdir -p ./libs
          # openssl@1.1, not @3: openssl@3 3.6 (the runner image ships
          # 3.6.4) no longer exports EVP_MD_size as a function, which
          # Crystal's stdlib references. The 1.1 archives provide it and
          # Crystal supports both ABIs.
          cp $(brew --prefix)/opt/openssl@1.1/lib/libssl.a ./libs
          cp $(brew --prefix)/opt/openssl@1.1/lib/libcrypto.a ./libs
          # libevent (optional: the default event loop is kqueue on macOS)
          cp $(brew --prefix)/opt/libevent/lib/libevent_pthreads.a ./libs || true
          cp $(brew --prefix)/opt/libevent/lib/libevent.a ./libs || true
          # libyaml
          cp $(brew --prefix)/opt/libyaml/lib/libyaml.a ./libs
          # libgc
          cp $(brew --prefix)/opt/bdw-gc/lib/libgc.a ./libs
          # libpcre
          cp $(brew --prefix)/opt/pcre2/lib/libpcre2-8.a ./libs
      - name: Build the binary
        run: |
          # pkg-config is neutralized so the link resolves every library
          # from the archives in ./libs: the runner image points
          # PKG_CONFIG_PATH at openssl@1.1's keg, whose pkg-config would
          # otherwise hand the linker -L flags for its dylibs.
          env CRYSTAL_LIBRARY_PATH=`pwd`/libs PKG_CONFIG_PATH= PKG_CONFIG_LIBDIR=/nonexistent crystal projects.cr build:cli --no-debug --release
          mkdir bin
          mv ./packages/cli/bin/zap ./bin/zap
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: zap_arm64-apple-darwin
          path: ./bin/zap
          if-no-files-found: error
  linux:
    runs-on: ubuntu-latest
    container:
      image: crystallang/crystal:latest-alpine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          apk del openssl-dev openssl-libs-static
          apk add libressl-dev
      - name: Build the static binary
        run: |
          crystal projects.cr build:cli --production --release --static --no-debug --stats
          mkdir bin
          mv ./packages/cli/bin/zap ./bin/zap
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: zap_x86_64-linux-musl
          path: ./bin/zap
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
      - name: Build the binary
        shell: bash
        run: |
          crystal projects.cr build:cli --progress --release --no-debug --stats
          mkdir bin
          mv ./packages/cli/bin/zap.exe ./bin/zap.exe
          ls -al ./bin
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: zap_x86_64-pc-win32.exe
          path: ${{ github.workspace }}\bin\zap.exe
          if-no-files-found: error
  trigger_release:
    runs-on: ubuntu-latest
    needs: [macos_x86_64, macos_arm64, linux, windows]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Check if release is needed
        run: |
          needs_release=$(git diff HEAD^1 shard.yml | grep "+version: " | wc -l | xargs)
          echo "needs_release=$needs_release" >> $GITHUB_ENV
      - name: Determine release version and tag
        uses: actions/github-script@v9
        id: release-data
        if: ${{ env.needs_release == 1 }}
        with:
          script: |
            const fs = require("fs")
            const shard = fs.readFileSync("shard.yml", "utf8")
            const match = shard.match(/^version:\s*(\S+)/m)
            if (!match) throw new Error("version missing from shard.yml")
            const version = match[1]
            const semverRegex = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/
            const [, major, minor, patch, prerelease, metadata] = version.match(semverRegex) || []
            if (!major) throw new Error(`invalid shard.yml version: ${version}`)
            const data = {
              version,
              major,
              minor,
              patch,
              prerelease,
              metadata,
              distTag: prerelease ? prerelease.split(".")[0] : "latest"
            }
            console.log(data)
            return data

      - name: Trigger release
        if: ${{ env.needs_release == 1 }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "release.yml" -f workflow_run_id=${{ github.run_id }} -f dist_tag="${{fromJSON(steps.release-data.outputs.result).distTag}}"
