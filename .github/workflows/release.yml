name: Release
on:
  workflow_dispatch:
    inputs:
      workflow_run_id:
        description: "Workflow run id"
        required: true
      dist_tag:
        description: "Npm dist tag"
        required: true
        default: "next"

permissions:
  id-token: write # Required for npm trusted publishing (OIDC)
  contents: write # Required to create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: latest
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never use caching in release builds
      - name: Download artifacts
        id: download-artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          run_id: ${{ github.event.inputs.workflow_run_id }}
          path: ./bin
      - name: Sync the npm package versions
        id: version
        # The npm wrappers carry their own package.json version, which is
        # otherwise only bumped by hand: derive it from the root shard.yml
        # (the version the binaries were built with) so publishing never
        # re-uses a stale version.
        run: |
          VERSION=$(grep -m1 '^version:' shard.yml | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          node npm/set-version.js "$VERSION"
      - name: Prepare the binaries
        # The copies under release-assets/ are attached to the GitHub release
        # for packagers (the Homebrew tap, and others later): the npm packages
        # are not a convenient source for them.
        run: |
          ls -al ./bin
          mkdir -p ./release-assets
          chmod u+x ./bin/zap_arm64-apple-darwin/zap
          cp ./bin/zap_arm64-apple-darwin/zap ./release-assets/zap-aarch64-apple-darwin
          mv ./bin/zap_arm64-apple-darwin/zap ./npm/darwin-arm64/bin/zap
          chmod u+x ./bin/zap_x86_64-linux-musl/zap
          cp ./bin/zap_x86_64-linux-musl/zap ./release-assets/zap-x86_64-unknown-linux-musl
          mv ./bin/zap_x86_64-linux-musl/zap ./npm/linux-x64/bin/zap
          chmod u+x ./bin/zap_x86_64-pc-win32.exe/zap.exe
          cp ./bin/zap_x86_64-pc-win32.exe/zap.exe ./release-assets/zap-x86_64-pc-windows-msvc.exe
          mv ./bin/zap_x86_64-pc-win32.exe/zap.exe ./npm/win32-x64/bin/zap
      - name: Publish to npm
        # Trusted publishing (OIDC): the npm CLI mints a short-lived token
        # from the workflow's OIDC identity; no long-lived npm token needed.
        run: |
          npm publish ./npm/darwin-arm64 --tag ${{ github.event.inputs.dist_tag }} --access public
          npm publish ./npm/linux-x64 --tag ${{ github.event.inputs.dist_tag }} --access public
          npm publish ./npm/win32-x64 --tag ${{ github.event.inputs.dist_tag }} --access public
          npm publish ./npm/zap --tag ${{ github.event.inputs.dist_tag }} --access public
      - name: Create the GitHub release
        # The tag already exists (pushed with the version bump); attach the
        # changelog entry for this version as the release notes, along with
        # the binaries. Both commands are idempotent so that a re-run
        # completes a partial release instead of failing on it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - "${{ steps.version.outputs.version }}" <<'EOF'
          import sys
          version = sys.argv[1]
          text = open("CHANGELOG.md").read()
          marker = f"## v{version}"
          idx = text.find(marker)
          if idx != -1:
              end = text.find("\n## ", idx + len(marker))
              notes = text[idx:end].strip() if end != -1 else text[idx:].strip()
          else:
              notes = f"No changelog entry for v{version}."
          open("/tmp/release-notes.md", "w").write(notes + "\n")
          EOF
          VERSION="${{ steps.version.outputs.version }}"
          gh release view "v$VERSION" >/dev/null 2>&1 ||
            gh release create "v$VERSION" --notes-file /tmp/release-notes.md
          gh release upload "v$VERSION" ./release-assets/* --clobber
