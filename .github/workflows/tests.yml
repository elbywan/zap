name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  specs:
    name: Specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
      - name: Install dependencies
        run: crystal projects.cr install
      - name: Run tests
        run: crystal projects.cr spec
  e2e:
    name: End-to-end
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: crystal projects.cr install
      - name: Build
        run: crystal projects.cr build:cli --release
      - name: Run end-to-end tests
        run: crystal spec spec/e2e/specs.cr --tag e2e
  launch:
    name: Build and check if the binary is working
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
      - name: Install dependencies
        run: crystal projects.cr install
      - name: Build
        run: crystal projects.cr build:cli --release
      - name: Print version
        run: ./packages/cli/bin/zap --version
      - name: Install a dummy project (benchmark)
        shell: bash
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/zap-bench"
          cd "$RUNNER_TEMP/zap-bench"
          printf '%s' '{"name":"bench","version":"1.0.0","dependencies":{"is-number":"^7.0.0","p-limit":"^5.0.0"}}' > package.json
          # Node is preinstalled on all runners; the date +%N and timeout
          # commands are not portable across macOS/Windows bash
          start=$(node -e "console.log(Date.now())")
          "$GITHUB_WORKSPACE/packages/cli/bin/zap" i --frozen-lockfile=false &
          pid=$!
          deadline=$((SECONDS + 120))
          while kill -0 $pid 2>/dev/null; do
            if [ $SECONDS -ge $deadline ]; then
              kill $pid 2>/dev/null || true
              echo "install timed out after 120s" >&2
              exit 1
            fi
            sleep 1
          done
          wait $pid
          end=$(node -e "console.log(Date.now())")
          echo "install time: $(( end - start ))ms"
          # The install must actually have worked on this platform
          test -d node_modules/is-number
          test -d node_modules/p-limit
